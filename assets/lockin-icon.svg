<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Lock In logo. Edit freely: colors are the two stop-colors, the mark is 3 shapes. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B3DF0"/>
      <stop offset="1" stop-color="#E83C74"/>
    </linearGradient>
  </defs>
  <!-- mark: a padlock whose body is the box, with the phone inside -->
  <rect x="0" y="0" width="128" height="128" rx="36" fill="url(#g)"/>
  <path d="M44 58V46a20 20 0 0 1 40 0v12" fill="none" stroke="#FBFAFF" stroke-width="10" stroke-linecap="round"/>
  <rect x="30" y="56" width="68" height="50" rx="14" fill="#FBFAFF"/>
  <rect x="56" y="66" width="16" height="30" rx="5" fill="url(#g)"/>
</svg>
